name: Compilar e testar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar com avisos tratados como erros
        run: make CC=gcc CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O2"
      - name: Executar testes
        run: make test CC=gcc CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O2"
